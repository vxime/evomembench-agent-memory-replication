<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 824" width="420" height="824" lang="de-de" role="img" aria-labelledby="evg-m-title evg-m-desc" font-family="Inter, Noto Sans CJK SC, system-ui, sans-serif">
<title id="evg-m-title">Ist der Gedächtnisgewinn eine Eigenschaft der Methode oder eine Funktion des Budgets?</title>
<desc id="evg-m-desc">Technische Prüfzeichnung (Mobilversion): Oben die Angaben des EvoMemBench-Papers (von den Autoren berichtet) – Finding 3 meldet bei 16K einen besten Gedächtnisgewinn von +14,5 Punkten. In der Mitte die präregistrierte Sonde: Nur das Kontextbudget wird von 16K auf 128K vergrößert, und die Token werden nach Zweck aufgeschlüsselt. Unten unsere Replikation auf dem Gorilla File System, 50 Aufgaben pro Zelle, an einem per Gateway-Label benannten Endpunkt: BM25-Gewinn von +4,0 auf 0,0 verpufft, ACE-Gewinn von +18,0 auf +6,0 geschrumpft; das ACE-Gedächtnismodul beansprucht 36,5 % seines eigenen Inputs, der Output beträgt etwa das 7,4-Fache der Baseline ohne Gedächtnis. Unten das Gesamturteil PARTIAL, begrenzt auf eine Umgebung, einen einzelnen labelbasierten Endpunkt und einen einzigen Lauf; Finding 5 ungetestet.</desc>
<defs>
<pattern id="evg-m-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#E7E4DB"/></pattern>
<marker id="evg-m-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8A98A6" stroke-width="1"/></marker>
<linearGradient id="evg-m-beamg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C95C" stop-opacity="0"/><stop offset=".5" stop-color="#F5C95C" stop-opacity=".8"/><stop offset="1" stop-color="#F5C95C" stop-opacity="0"/></linearGradient>
</defs>
<style>
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes beam{0%{opacity:0;transform:translateX(0)}18%{opacity:1}82%{opacity:1;transform:translateX(238px)}100%{opacity:0;transform:translateX(238px)}}
@keyframes ring{0%{stroke-opacity:.15}65%{stroke-opacity:1}100%{stroke-opacity:.85}}
@keyframes shrinkAce{from{transform:scaleX(3)}to{transform:scaleX(1)}}
@keyframes shrinkBm{from{transform:scaleX(11)}to{transform:scaleX(1)}}
.surface{animation:rise .55s .15s ease-out both;transform-box:fill-box;transform-origin:center}
.probe{animation:rise .55s .8s ease-out both;transform-box:fill-box;transform-origin:center}
.scan{animation:beam 1.7s 1.15s ease-in-out both;transform-box:fill-box;transform-origin:left center}
.focus{animation:ring .7s 2.5s ease-out both}
.bars{animation:rise .5s 1.9s ease-out both;transform-box:fill-box;transform-origin:center}
.shrinkAce{animation:shrinkAce 1s 2.3s ease-out both;transform-box:fill-box;transform-origin:left center}
.shrinkBm{animation:shrinkBm 1s 2.3s ease-out both;transform-box:fill-box;transform-origin:left center}
.rent{animation:rise .55s 3.5s ease-out both;transform-box:fill-box;transform-origin:center}
.paired{animation:rise .55s 4.4s ease-out both;transform-box:fill-box;transform-origin:center}
.scope{animation:rise .55s 5.4s ease-out both;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="420" height="824" fill="#FAF9F5"/><rect width="420" height="824" fill="url(#evg-m-dots)" opacity=".72"/><rect x="10" y="10" width="400" height="804" rx="11" fill="none" stroke="#E1DFD7"/>
<text x="24" y="36" font-size="9.5" font-weight="700" letter-spacing="1" fill="#53677B">EVOMEMBENCH / GEWINN- &amp; KOSTENCHECK</text>
<text x="24" y="64" font-size="20" font-weight="700" fill="#16324F">Ist der Gedächtnisgewinn</text>
<text x="24" y="90" font-size="20" font-weight="700" fill="#16324F">Methoden- oder Budgetfunktion?</text>
<text x="24" y="114" font-size="11.5" fill="#53677B">Zwei stille Annahmen: Gewinn = Methodensache,</text>
<text x="24" y="132" font-size="11.5" fill="#53677B">Gedächtnis = gratis. Präregistrierte Sonde prüft beide.</text>
<rect x="24" y="142" width="168" height="20" rx="5" fill="#F1E9D5" stroke="#E2D4B5"/><text x="108" y="156" font-size="10.5" font-weight="600" fill="#7A6220" text-anchor="middle">Teilmenge · nicht Original</text>

<g class="surface">
<rect x="24" y="176" width="372" height="156" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="24" y="176" width="372" height="28" rx="9" fill="#EFF3F6"/><rect x="24" y="192" width="372" height="12" fill="#EFF3F6"/>
<text x="38" y="195" font-size="12.5" font-weight="700" fill="#16324F">Oberflächenbefund</text>
<text x="382" y="195" font-size="10" fill="#53677B" text-anchor="end">Autorenwerte (Paper)</text>
<text x="38" y="234" font-size="26" font-weight="700" fill="#16324F">+14,5</text>
<text x="152" y="226" font-size="12" fill="#33475B">16K-Bestgewinn (Punkte)</text>
<text x="152" y="244" font-size="11" fill="#53677B">DeepSeek-V3.2 · 15 Methoden · Ranking</text>
<text x="38" y="272" font-size="10.5" fill="#33475B">„Budget knapp, Gedächtnis stark" · „Ausführung: prozedural"</text>
<text x="38" y="294" font-size="11.5" fill="#53677B">128K: Methoden unter der Baseline (Paper-Bericht)</text>
<text x="38" y="306" font-size="10.5" fill="#8A98A6">Paper-Werte; unten unsere Messung.</text>
<text x="38" y="322" font-size="10.5" fill="#8A98A6">Annahme ①: Gewinn budgetunabhängig ②: Gedächtnis gratis</text>
</g>

<g class="probe">
<rect x="24" y="344" width="372" height="148" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="24" y="344" width="372" height="28" rx="9" fill="#FBF3DF"/><rect x="24" y="360" width="372" height="12" fill="#FBF3DF"/>
<text x="38" y="363" font-size="12.5" font-weight="700" fill="#16324F">Gegenprobe</text>
<text x="382" y="363" font-size="10" fill="#7A6220" text-anchor="end">präregistriert · fixiert</text>
<rect x="38" y="382" width="64" height="30" rx="6" fill="#EFF3F6" stroke="#C9D4DE"/><text x="70" y="402" font-size="13.5" font-weight="700" fill="#16324F" text-anchor="middle">16K</text>
<line x1="108" y1="389" x2="146" y2="389" stroke="#8A98A6" marker-end="url(#evg-m-arrow)"/>
<rect x="152" y="382" width="64" height="30" rx="6" fill="#16324F"/><text x="184" y="402" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">128K</text>
<text x="226" y="402" font-size="11" fill="#53677B">Nur Budget vergrößert</text>
<rect x="38" y="422" width="344" height="56" rx="6" fill="#FAF9F5" stroke="#E1DFD7"/>
<text x="48" y="440" font-size="10.5" fill="#53677B">Ausführung</text><rect x="112" y="431" width="180" height="8" rx="3" fill="#B9C9D6"/>
<text x="48" y="464" font-size="10.5" font-weight="700" fill="#7A6220">Pflege</text><rect x="112" y="455" width="88" height="8" rx="3" fill="#E3B23C"/>
<rect class="focus" x="106" y="446" width="112" height="26" rx="5" fill="none" stroke="#B08A2E" stroke-width="1.3" stroke-opacity=".85"/>
<rect class="scan" x="42" y="420" width="50" height="60" fill="url(#evg-m-beamg)"/>
</g>

<g class="bars">
<rect x="24" y="504" width="372" height="184" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="24" y="504" width="372" height="28" rx="9" fill="#EFF3F6"/><rect x="24" y="520" width="372" height="12" fill="#EFF3F6"/>
<text x="38" y="523" font-size="12.5" font-weight="700" fill="#16324F">Sondenergebnis</text>
<text x="382" y="523" font-size="10" fill="#53677B" text-anchor="end">eigene Messung · Gorilla FS · n=50</text>
<text x="38" y="544" font-size="12" font-weight="700" fill="#33475B">ACE</text>
<rect x="80" y="542" width="150" height="10" rx="3" fill="#B9C9D6"/><text x="238" y="551" font-size="11" fill="#53677B">16K +18,0</text>
<rect class="shrinkAce" x="80" y="558" width="50" height="10" rx="3" fill="#16324F"/><text x="238" y="567" font-size="11" font-weight="700" fill="#16324F">128K +6,0</text>
<text x="38" y="584" font-size="12" font-weight="700" fill="#33475B">BM25</text>
<rect x="80" y="582" width="33" height="10" rx="3" fill="#B9C9D6"/><text x="238" y="591" font-size="11" fill="#53677B">16K +4,0</text>
<rect class="shrinkBm" x="80" y="598" width="3" height="10" rx="1.5" fill="#C4463F"/><text x="238" y="607" font-size="11" font-weight="700" fill="#C4463F">128K 0,0 · verpufft</text>
<text x="38" y="630" font-size="11" fill="#53677B">Ohne Gedächtnis: 38 % → 44 % (19/50 → 22/50)</text>
</g>
<g class="rent">
<rect x="38" y="640" width="344" height="40" rx="6" fill="#FBF0EE" stroke="#C4463F" stroke-dasharray="5 4"/>
<text x="50" y="658" font-size="11" fill="#33475B">Miete: ACE-Modul = <tspan font-weight="700" fill="#C4463F">36,5 %</tspan> Eigeninput · Output ≈ 7,4×</text>
<text x="50" y="674" font-size="10.5" fill="#53677B">Gewinn schrumpft · Miete bleibt: 1,34 → 1,32 Mio.</text>
</g>

<g class="scope">
<line x1="24" y1="696" x2="396" y2="696" stroke="#E1DFD7"/>
<text x="24" y="728" font-size="11" fill="#33475B">Präregistriert → nur Budget geändert → Token-Split → <tspan font-weight="700" fill="#B08A2E">PARTIAL</tspan></text>
<text x="24" y="750" font-size="11" fill="#53677B">Paarvergleich (50 Tasks): ACE@16K +9 / −0 · CI [0, +26]</text>
<text x="24" y="770" font-size="11" fill="#53677B">Gorilla FS · Gateway-Endpunkt, Identität unprüfbar · 1 Lauf</text>
<text x="24" y="790" font-size="11" fill="#53677B">Finding 5 ungetestet · kein Fall unter Baseline (128K)</text>
</g>
</svg>
