<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" lang="de-de" role="img" aria-labelledby="evg-d-title evg-d-desc" font-family="Inter, Noto Sans CJK SC, system-ui, sans-serif">
<title id="evg-d-title">Ist der Gedächtnisgewinn eine Eigenschaft der Methode oder eine Funktion des Budgets?</title>
<desc id="evg-d-desc">Technische Prüfzeichnung: Links die Angaben des EvoMemBench-Papers (von den Autoren berichtet) – Finding 3 meldet bei 16K einen besten Gedächtnisgewinn von +14,5 Punkten; je enger das Budget, desto nützlicher das Gedächtnis. In der Mitte die präregistrierte Sonde: Nur das Kontextbudget wird von 16K auf 128K vergrößert, alle übrigen Einstellungen bleiben eingefroren, und die Token werden nach Zweck aufgeschlüsselt. Rechts unsere Replikation auf dem Gorilla File System, 50 Aufgaben pro Zelle, an einem per Gateway-Label benannten Endpunkt: BM25-Gewinn von +4,0 auf 0,0 verpufft, ACE-Gewinn von +18,0 auf +6,0 geschrumpft; das ACE-Gedächtnismodul beansprucht 36,5 % seines eigenen Inputs, der Output beträgt etwa das 7,4-Fache der Baseline ohne Gedächtnis – der Gewinn schrumpft, die Miete nicht. Unten das Gesamturteil PARTIAL, begrenzt auf eine Umgebung, einen einzelnen labelbasierten Endpunkt und einen einzigen Lauf; Finding 5 ungetestet.</desc>
<defs>
<pattern id="evg-d-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#E7E4DB"/></pattern>
<marker id="evg-d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8A98A6" stroke-width="1"/></marker>
<linearGradient id="evg-d-beamg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C95C" stop-opacity="0"/><stop offset=".5" stop-color="#F5C95C" stop-opacity=".8"/><stop offset="1" stop-color="#F5C95C" stop-opacity="0"/></linearGradient>
</defs>
<style>
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes beam{0%{opacity:0;transform:translateX(0)}18%{opacity:1}82%{opacity:1;transform:translateX(300px)}100%{opacity:0;transform:translateX(300px)}}
@keyframes ring{0%{stroke-opacity:.15}65%{stroke-opacity:1}100%{stroke-opacity:.85}}
@keyframes shrinkAce{from{transform:scaleX(3)}to{transform:scaleX(1)}}
@keyframes shrinkBm{from{transform:scaleX(11)}to{transform:scaleX(1)}}
.surface{animation:rise .55s .15s ease-out both;transform-box:fill-box;transform-origin:center}
.probe{animation:rise .55s .8s ease-out both;transform-box:fill-box;transform-origin:center}
.scan{animation:beam 1.7s 1.15s ease-in-out both;transform-box:fill-box;transform-origin:left center}
.focus{animation:ring .7s 2.5s ease-out both}
.bars{animation:rise .5s 1.9s ease-out both;transform-box:fill-box;transform-origin:center}
.shrinkAce{animation:shrinkAce 1s 2.3s ease-out both;transform-box:fill-box;transform-origin:left center}
.shrinkBm{animation:shrinkBm 1s 2.3s ease-out both;transform-box:fill-box;transform-origin:left center}
.rent{animation:rise .55s 3.5s ease-out both;transform-box:fill-box;transform-origin:center}
.paired{animation:rise .55s 4.4s ease-out both;transform-box:fill-box;transform-origin:center}
.scope{animation:rise .55s 5.4s ease-out both;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="1200" height="700" fill="#FAF9F5"/><rect width="1200" height="700" fill="url(#evg-d-dots)" opacity=".72"/><rect x="18" y="18" width="1164" height="664" rx="11" fill="none" stroke="#E1DFD7"/>
<text x="40" y="43" font-size="10.5" font-weight="700" letter-spacing="1" fill="#53677B">EVOMEMBENCH / GEWINN- &amp; KOSTENCHECK</text>
<rect x="938" y="25" width="220" height="27" rx="5" fill="#F1E9D5" stroke="#E2D4B5"/><text x="1048" y="43" font-size="11.5" font-weight="600" fill="#7A6220" text-anchor="middle">Teilreplikation · nicht Original</text>
<text x="40" y="84" font-size="27" font-weight="700" fill="#16324F">Gedächtnisgewinn: Eigenschaft der Methode oder Funktion des Budgets?</text>
<text x="40" y="110" font-size="14" fill="#53677B">Zwei stille Annahmen der Ergebnistabelle: Gewinn = Methodensache, Gedächtnis = kostenlos. Eine präregistrierte Sonde prüft beide einzeln.</text>

<!-- LEFT: surface -->
<g class="surface">
<rect x="40" y="132" width="356" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="40" y="132" width="356" height="34" rx="9" fill="#EFF3F6"/><rect x="40" y="152" width="356" height="14" fill="#EFF3F6"/>
<text x="56" y="154" font-size="13" font-weight="700" fill="#16324F">Oberflächenbefund</text>
<rect x="252" y="141" width="128" height="17" rx="4" fill="#E8EEF2"/><text x="316" y="153" font-size="10.5" fill="#53677B" text-anchor="middle">Autorenwerte (Paper)</text>
<text x="56" y="196" font-size="11.5" font-weight="700" letter-spacing="1" fill="#53677B">FINDING 3 · PAPER-BERICHT</text>
<text x="56" y="238" font-size="34" font-weight="700" fill="#16324F">+14,5</text>
<text x="206" y="238" font-size="13.5" fill="#33475B">Punkte · 16K-Bestgewinn</text>
<text x="56" y="262" font-size="12.5" fill="#53677B">DeepSeek-V3.2 · 15 Methoden · ein Ranking</text>
<line x1="56" y1="282" x2="380" y2="282" stroke="#E1DFD7"/>
<text x="56" y="312" font-size="14" fill="#33475B">„Gedächtnis hilft, wo Budget knapp ist"</text>
<text x="56" y="342" font-size="13.5" fill="#33475B">„Ausführung: prozedurales Gedächtnis vorn"</text>
<text x="56" y="372" font-size="12" fill="#53677B">128K: Methoden unter Baseline ohne Gedächtnis</text>
<line x1="56" y1="392" x2="380" y2="392" stroke="#E1DFD7"/>
<text x="56" y="420" font-size="12" fill="#8A98A6">Paper-Werte; rechts erst unsere Messung.</text>
<text x="56" y="446" font-size="12" fill="#8A98A6">Annahme ①: Gewinn gilt auch bei anderem Budget</text>
<text x="56" y="472" font-size="12" fill="#8A98A6">Annahme ②: Gedächtnis kostet sonst nichts</text>
<text x="56" y="504" font-size="11.5" font-weight="700" letter-spacing="1" fill="#B08A2E">→ Beide Annahmen ungeprüft</text>
</g>

<!-- CENTER: probe -->
<g class="probe">
<rect x="420" y="132" width="360" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="420" y="132" width="360" height="34" rx="9" fill="#FBF3DF"/><rect x="420" y="152" width="360" height="14" fill="#FBF3DF"/>
<text x="436" y="154" font-size="13" font-weight="700" fill="#16324F">Gegenprobe</text>
<rect x="612" y="141" width="152" height="17" rx="4" fill="#F1E9D5"/><text x="688" y="153" font-size="10.5" fill="#7A6220" text-anchor="middle">präregistriert · fixiert</text>
<text x="436" y="196" font-size="12.5" fill="#33475B">Nur eine Variable: das Kontextbudget</text>
<rect x="436" y="210" width="86" height="40" rx="6" fill="#EFF3F6" stroke="#C9D4DE"/><text x="479" y="236" font-size="16" font-weight="700" fill="#16324F" text-anchor="middle">16K</text>
<line x1="530" y1="230" x2="596" y2="230" stroke="#8A98A6" marker-end="url(#evg-d-arrow)"/>
<text x="563" y="220" font-size="11" fill="#53677B" text-anchor="middle">größer</text>
<rect x="604" y="210" width="86" height="40" rx="6" fill="#16324F"/><text x="647" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">128K</text>
<text x="436" y="276" font-size="11" fill="#53677B">3 Arme, gleiche Aufgaben: ohne Gedächtnis / BM25 / ACE</text>
<line x1="436" y1="296" x2="764" y2="296" stroke="#E1DFD7"/>
<text x="436" y="324" font-size="12.5" fill="#33475B">Token je Episode nach Zweck aufschlüsseln:</text>
<rect x="436" y="338" width="328" height="86" rx="6" fill="#FAF9F5" stroke="#E1DFD7"/>
<text x="448" y="360" font-size="11.5" fill="#53677B">Task-Ausführung</text>
<rect x="448" y="368" width="240" height="10" rx="3" fill="#B9C9D6"/>
<text x="448" y="398" font-size="11.5" fill="#7A6220" font-weight="700">Gedächtnispflege</text>
<rect x="448" y="406" width="118" height="10" rx="3" fill="#E3B23C"/>
<rect class="focus" x="442" y="384" width="180" height="38" rx="6" fill="none" stroke="#B08A2E" stroke-width="1.4" stroke-opacity=".85"/>
<circle cx="648" cy="392" r="17" fill="none" stroke="#16324F" stroke-width="2"/><line x1="660" y1="404" x2="676" y2="420" stroke="#16324F" stroke-width="2.4"/>
<rect class="scan" x="440" y="334" width="64" height="94" fill="url(#evg-d-beamg)"/>
<text x="436" y="452" font-size="12" fill="#8A98A6">Prüfplan: Budget × Kosten, präregistriert.</text>
<text x="436" y="478" font-size="10.5" fill="#8A98A6">Protokoll, Prompts, Scoring original; Transport ersetzt.</text>
<text x="436" y="504" font-size="11.5" font-weight="700" letter-spacing="1" fill="#B08A2E">→ Annahme ① prüft Gewinn, ② die Rechnung</text>
</g>

<!-- RIGHT: counterexample results -->
<g class="bars">
<rect x="804" y="132" width="356" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="804" y="132" width="356" height="34" rx="9" fill="#EFF3F6"/><rect x="804" y="152" width="356" height="14" fill="#EFF3F6"/>
<text x="820" y="154" font-size="13" font-weight="700" fill="#16324F">Sondenergebnis</text>
<rect x="976" y="141" width="168" height="17" rx="4" fill="#E8EEF2"/><text x="1060" y="153" font-size="10.5" fill="#53677B" text-anchor="middle">Eigene Messung · Gorilla FS</text>
<text x="820" y="192" font-size="12.5" font-weight="700" fill="#33475B">ACE prozedural</text>
<rect x="820" y="200" width="150" height="12" rx="3" fill="#B9C9D6"/><text x="978" y="211" font-size="12" fill="#53677B">16K +18,0</text>
<rect class="shrinkAce" x="820" y="218" width="50" height="12" rx="3" fill="#16324F"/><text x="978" y="229" font-size="12" font-weight="700" fill="#16324F">128K +6,0</text>
<text x="820" y="262" font-size="12.5" font-weight="700" fill="#33475B">BM25 Retrieval</text>
<rect x="820" y="270" width="33" height="12" rx="3" fill="#B9C9D6"/><text x="978" y="281" font-size="12" fill="#53677B">16K +4,0</text>
<rect class="shrinkBm" x="820" y="288" width="3" height="12" rx="1.5" fill="#C4463F"/><text x="978" y="299" font-size="12" font-weight="700" fill="#C4463F">128K 0,0 · verpufft</text>
<text x="820" y="326" font-size="12" fill="#53677B">Ohne Gedächtnis: 38 % → 44 % (19/50 → 22/50)</text>
</g>
<g class="rent">
<rect x="820" y="344" width="324" height="112" rx="7" fill="#FBF0EE" stroke="#C4463F" stroke-dasharray="5 4"/>
<text x="836" y="368" font-size="12" font-weight="700" letter-spacing="1" fill="#C4463F">In der Tabelle versteckte Miete</text>
<text x="836" y="396" font-size="15.5" fill="#33475B">ACE-Modul: <tspan font-weight="700" fill="#C4463F">36,5 %</tspan> des Eigeninputs</text>
<text x="836" y="420" font-size="12.5" fill="#33475B">Output ≈ 7,4× der Baseline</text>
<text x="836" y="442" font-size="11" fill="#33475B">Gewinn schrumpft · Miete bleibt: 1,34 → 1,32 Mio.</text>
</g>
<g class="paired">
<text x="820" y="478" font-size="11.5" fill="#33475B">Paarvergleich (gleiche 50 Tasks): ACE@16K +9 / −0</text>
<text x="820" y="498" font-size="11.5" fill="#53677B">12 Punkte Schrumpfung · Bootstrap-CI [0, +26]</text>
<text x="820" y="518" font-size="11.5" fill="#8A98A6">BM25 ≈ null · Baseline hier nicht unterschritten</text>
</g>

<!-- BOTTOM: method chain + scope -->
<g class="scope">
<line x1="40" y1="544" x2="1160" y2="544" stroke="#E1DFD7"/>
<text x="40" y="572" font-size="12" font-weight="700" letter-spacing="1" fill="#53677B">Methodenkette</text>
<text x="40" y="600" font-size="14.5" fill="#33475B">Präregistriert <tspan fill="#8A98A6">→</tspan> nur Budget geändert <tspan fill="#8A98A6">→</tspan> Token nach Zweck getrennt <tspan fill="#8A98A6">→</tspan> Urteil <tspan font-weight="700" fill="#B08A2E">PARTIAL</tspan></text>
<text x="40" y="628" font-size="12.5" fill="#53677B">Richtung reproduziert: Schrumpfung ja · Endklausel (Baseline) nein</text>
<line x1="700" y1="560" x2="700" y2="648" stroke="#E1DFD7"/>
<text x="724" y="572" font-size="12" font-weight="700" letter-spacing="1" fill="#53677B">Geltungsbereich</text>
<text x="724" y="600" font-size="12.5" fill="#33475B">Nur Gorilla FS · ein Gateway-Endpunkt (Identität unprüfbar)</text>
<text x="724" y="628" font-size="12.5" fill="#33475B">Ein einziger Lauf · Finding 5 ungetestet (Sonde abgebrochen)</text>
</g>
</svg>
