<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" lang="ja-jp" role="img" aria-labelledby="evg-d-title evg-d-desc" font-family="Inter, Noto Sans CJK JP, system-ui, sans-serif">
<title id="evg-d-title">記憶ゲインは、手法の属性か、予算の関数か？</title>
<desc id="evg-d-desc">工学レビュー図：左は EvoMemBench 論文の口径（著者報告）——Finding 3 は 16K 枠での最良の記憶ゲイン +14.5 ポイント、予算が厳しいほど記憶が効くと報告。中央は事前登録プローブ：コンテキスト予算を 16K から 128K に拡大するだけ、他は凍結し、token を用途別に分解。右は Gorilla File System、各セル50問、ゲートウェイ表示エンドポイントでの当方の再測定：BM25 ゲインは +4.0 から 0.0 に蒸発、ACE ゲインは +18.0 から +6.0 に縮小；ACE 記憶モジュールは自らの入力 token の 36.5% を占め、出力は記憶なしベースラインの約 7.4 倍、ゲインが縮んでも家賃は縮まない。下部の結論は複合判定 PARTIAL、範囲は単一環境・単一の表示エンドポイント・単回実行に限られ、Finding 5 は未測定。</desc>
<defs>
<pattern id="evg-d-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#E7E4DB"/></pattern>
<marker id="evg-d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8A98A6" stroke-width="1"/></marker>
<linearGradient id="evg-d-beamg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C95C" stop-opacity="0"/><stop offset=".5" stop-color="#F5C95C" stop-opacity=".8"/><stop offset="1" stop-color="#F5C95C" stop-opacity="0"/></linearGradient>
</defs>
<style>
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes beam{0%{opacity:0;transform:translateX(0)}18%{opacity:1}82%{opacity:1;transform:translateX(300px)}100%{opacity:0;transform:translateX(300px)}}
@keyframes ring{0%{stroke-opacity:.15}65%{stroke-opacity:1}100%{stroke-opacity:.85}}
@keyframes shrinkAce{from{transform:scaleX(3)}to{transform:scaleX(1)}}
@keyframes shrinkBm{from{transform:scaleX(11)}to{transform:scaleX(1)}}
.surface{animation:rise .55s .15s ease-out both;transform-box:fill-box;transform-origin:center}
.probe{animation:rise .55s .8s ease-out both;transform-box:fill-box;transform-origin:center}
.scan{animation:beam 1.7s 1.15s ease-in-out both;transform-box:fill-box;transform-origin:left center}
.focus{animation:ring .7s 2.5s ease-out both}
.bars{animation:rise .5s 1.9s ease-out both;transform-box:fill-box;transform-origin:center}
.shrinkAce{animation:shrinkAce 1s 2.3s ease-out both;transform-box:fill-box;transform-origin:left center}
.shrinkBm{animation:shrinkBm 1s 2.3s ease-out both;transform-box:fill-box;transform-origin:left center}
.rent{animation:rise .55s 3.5s ease-out both;transform-box:fill-box;transform-origin:center}
.paired{animation:rise .55s 4.4s ease-out both;transform-box:fill-box;transform-origin:center}
.scope{animation:rise .55s 5.4s ease-out both;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="1200" height="700" fill="#FAF9F5"/><rect width="1200" height="700" fill="url(#evg-d-dots)" opacity=".72"/><rect x="18" y="18" width="1164" height="664" rx="11" fill="none" stroke="#E1DFD7"/>
<text x="40" y="43" font-size="10.5" font-weight="700" letter-spacing="1" fill="#53677B">EVOMEMBENCH / GAIN &amp; COST REVIEW</text>
<rect x="938" y="25" width="220" height="27" rx="5" fill="#F1E9D5" stroke="#E2D4B5"/><text x="1048" y="43" font-size="11.5" font-weight="600" fill="#7A6220" text-anchor="middle">サブセット再現 · 元口径ではない</text>
<text x="40" y="84" font-size="27" font-weight="700" fill="#16324F">記憶ゲインは、手法の属性か、予算の関数か？</text>
<text x="40" y="110" font-size="14" fill="#53677B">スコア表に書かれていない前提が二つ：ゲインは手法についてくる、記憶はタダだと思われている。事前登録プローブで一つずつ検証する。</text>

<!-- LEFT: surface -->
<g class="surface">
<rect x="40" y="132" width="356" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="40" y="132" width="356" height="34" rx="9" fill="#EFF3F6"/><rect x="40" y="152" width="356" height="14" fill="#EFF3F6"/>
<text x="56" y="154" font-size="13" font-weight="700" fill="#16324F">表向きの主張</text>
<rect x="252" y="141" width="128" height="17" rx="4" fill="#E8EEF2"/><text x="316" y="153" font-size="10.5" fill="#53677B" text-anchor="middle">論文の口径 · 著者報告</text>
<text x="56" y="196" font-size="11.5" font-weight="700" letter-spacing="1" fill="#53677B">FINDING 3 · 論文の報告</text>
<text x="56" y="238" font-size="34" font-weight="700" fill="#16324F">+14.5 点</text>
<text x="206" y="238" font-size="13.5" fill="#33475B">16K での最大記憶ゲイン</text>
<text x="56" y="262" font-size="12" fill="#53677B">バックボーン DeepSeek-V3.2 · 15 手法を統一ランキング</text>
<line x1="56" y1="282" x2="380" y2="282" stroke="#E1DFD7"/>
<text x="56" y="312" font-size="14" fill="#33475B">「予算が厳しいほど、記憶は効く」</text>
<text x="56" y="342" font-size="14" fill="#33475B">「手続き型記憶が実行タスクに最も向く」</text>
<text x="56" y="372" font-size="12.5" fill="#53677B">128K では一部手法が記憶なしベースライン未満</text>
<line x1="56" y1="392" x2="380" y2="392" stroke="#E1DFD7"/>
<text x="56" y="420" font-size="12" fill="#8A98A6">以上は論文の報告値；当方の測定は右側。</text>
<text x="56" y="446" font-size="12" fill="#8A98A6">隠れた前提 ① ゲインは手法の属性で、予算によらない</text>
<text x="56" y="472" font-size="12" fill="#8A98A6">隠れた前提 ② 記憶はスコア表の外ではタダ</text>
<text x="56" y="504" font-size="11.5" font-weight="700" letter-spacing="1" fill="#B08A2E">→ どちらの前提も未検証</text>
</g>

<!-- CENTER: probe -->
<g class="probe">
<rect x="420" y="132" width="360" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="420" y="132" width="360" height="34" rx="9" fill="#FBF3DF"/><rect x="420" y="152" width="360" height="14" fill="#FBF3DF"/>
<text x="436" y="154" font-size="13" font-weight="700" fill="#16324F">反例プローブ</text>
<rect x="612" y="141" width="152" height="17" rx="4" fill="#F1E9D5"/><text x="688" y="153" font-size="10.5" fill="#7A6220" text-anchor="middle">事前登録 · 設定凍結</text>
<text x="436" y="196" font-size="12.5" fill="#33475B">動かす変数は一つだけ：コンテキスト予算</text>
<rect x="436" y="210" width="86" height="40" rx="6" fill="#EFF3F6" stroke="#C9D4DE"/><text x="479" y="236" font-size="16" font-weight="700" fill="#16324F" text-anchor="middle">16K</text>
<line x1="530" y1="230" x2="596" y2="230" stroke="#8A98A6" marker-end="url(#evg-d-arrow)"/>
<text x="563" y="220" font-size="11" fill="#53677B" text-anchor="middle">拡大</text>
<rect x="604" y="210" width="86" height="40" rx="6" fill="#16324F"/><text x="647" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">128K</text>
<text x="436" y="276" font-size="12.5" fill="#53677B">同じ問題で3アーム対照：記憶なし / BM25 / ACE 手続き型</text>
<line x1="436" y1="296" x2="764" y2="296" stroke="#E1DFD7"/>
<text x="436" y="324" font-size="12.5" fill="#33475B">各 episode の token を用途別に分解すると：</text>
<rect x="436" y="338" width="328" height="86" rx="6" fill="#FAF9F5" stroke="#E1DFD7"/>
<text x="448" y="360" font-size="11.5" fill="#53677B">タスク実行</text>
<rect x="448" y="368" width="240" height="10" rx="3" fill="#B9C9D6"/>
<text x="448" y="398" font-size="10.5" fill="#7A6220" font-weight="700">記憶の維持（内省・キュレーション）</text>
<rect x="448" y="406" width="118" height="10" rx="3" fill="#E3B23C"/>
<rect class="focus" x="442" y="384" width="180" height="38" rx="6" fill="none" stroke="#B08A2E" stroke-width="1.4" stroke-opacity=".85"/>
<circle cx="648" cy="392" r="17" fill="none" stroke="#16324F" stroke-width="2"/><line x1="660" y1="404" x2="676" y2="420" stroke="#16324F" stroke-width="2.4"/>
<rect class="scan" x="440" y="334" width="64" height="94" fill="url(#evg-d-beamg)"/>
<text x="436" y="452" font-size="12" fill="#8A98A6">検証：予算の段階 × コスト分解、両方とも事前登録済み</text>
<text x="436" y="478" font-size="12" fill="#8A98A6">プロトコル等は公式固定版のまま；転送層のみ差し替え</text>
<text x="436" y="504" font-size="11.5" font-weight="700" letter-spacing="1" fill="#B08A2E">→ ① ゲインを検証、② 請求額を検証</text>
</g>

<!-- RIGHT: counterexample results -->
<g class="bars">
<rect x="804" y="132" width="356" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="804" y="132" width="356" height="34" rx="9" fill="#EFF3F6"/><rect x="804" y="152" width="356" height="14" fill="#EFF3F6"/>
<text x="820" y="154" font-size="13" font-weight="700" fill="#16324F">プローブ結果</text>
<rect x="976" y="141" width="168" height="17" rx="4" fill="#E8EEF2"/><text x="1060" y="153" font-size="10" fill="#53677B" text-anchor="middle">当方測定 · Gorilla FS · n=50/セル</text>
<text x="820" y="192" font-size="12.5" font-weight="700" fill="#33475B">ACE 手続き型</text>
<rect x="820" y="200" width="150" height="12" rx="3" fill="#B9C9D6"/><text x="978" y="211" font-size="12" fill="#53677B">16K +18.0</text>
<rect class="shrinkAce" x="820" y="218" width="50" height="12" rx="3" fill="#16324F"/><text x="978" y="229" font-size="12" font-weight="700" fill="#16324F">128K +6.0</text>
<text x="820" y="262" font-size="12.5" font-weight="700" fill="#33475B">BM25 検索</text>
<rect x="820" y="270" width="33" height="12" rx="3" fill="#B9C9D6"/><text x="978" y="281" font-size="12" fill="#53677B">16K +4.0</text>
<rect class="shrinkBm" x="820" y="288" width="3" height="12" rx="1.5" fill="#C4463F"/><text x="978" y="299" font-size="12" font-weight="700" fill="#C4463F">128K 0.0 · 蒸発</text>
<text x="820" y="326" font-size="10.5" fill="#53677B">ベースラインも強化：記憶なし 38% → 44%（19/50 → 22/50）</text>
</g>
<g class="rent">
<rect x="820" y="344" width="324" height="112" rx="7" fill="#FBF0EE" stroke="#C4463F" stroke-dasharray="5 4"/>
<text x="836" y="368" font-size="12" font-weight="700" letter-spacing="1" fill="#C4463F">スコア表に出ない家賃</text>
<text x="836" y="396" font-size="15" fill="#33475B">ACE 記憶モジュール = 自身の入力の <tspan font-weight="700" fill="#C4463F">36.5%</tspan></text>
<text x="836" y="420" font-size="12.5" fill="#33475B">出力 ≈ ベースラインの 7.4×</text>
<text x="836" y="442" font-size="12" fill="#33475B">ゲインは縮んでも家賃は縮まない（134 万 → 132 万）</text>
</g>
<g class="paired">
<text x="820" y="478" font-size="11.5" fill="#33475B">ペア検証（同じ50問）：ACE@16K 勝ち 9 · 負け 0</text>
<text x="820" y="498" font-size="11.5" fill="#53677B">縮小 12 点 · ペア bootstrap CI [0, +26]</text>
<text x="820" y="518" font-size="11.5" fill="#8A98A6">BM25 の縮小はゼロと区別不能 · 割れは未発生</text>
</g>

<!-- BOTTOM: method chain + scope -->
<g class="scope">
<line x1="40" y1="544" x2="1160" y2="544" stroke="#E1DFD7"/>
<text x="40" y="572" font-size="12" font-weight="700" letter-spacing="1" fill="#53677B">方法チェーン</text>
<text x="40" y="600" font-size="14.5" fill="#33475B">事前登録 <tspan fill="#8A98A6">→</tspan> 予算だけ変更 <tspan fill="#8A98A6">→</tspan> 用途別に token 分解 <tspan fill="#8A98A6">→</tspan> 複合判定 <tspan font-weight="700" fill="#B08A2E">PARTIAL</tspan></text>
<text x="40" y="628" font-size="12.5" fill="#53677B">方向は再現：ゲインは予算とともに縮小 · 末尾の節（ベースライン割れ）は再現せず</text>
<line x1="700" y1="560" x2="700" y2="648" stroke="#E1DFD7"/>
<text x="724" y="572" font-size="12" font-weight="700" letter-spacing="1" fill="#53677B">証拠の範囲</text>
<text x="724" y="600" font-size="12.5" fill="#33475B">単一環境 Gorilla FS · 単一エンドポイント（表示のみ・検証不能）</text>
<text x="724" y="628" font-size="12.5" fill="#33475B">単回実行 · Finding 5 は未測定（プローブは中止）</text>
</g>
</svg>
