<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" lang="zh-cn" role="img" aria-labelledby="evg-d-title evg-d-desc" font-family="Inter, Noto Sans CJK SC, system-ui, sans-serif">
<title id="evg-d-title">记忆增益，是方法的属性，还是预算的函数？</title>
<desc id="evg-d-desc">工程审查插画：左侧为 EvoMemBench 论文口径（作者自报）——Finding 3 报告 16K 档最佳记忆增益 +14.5 分、预算越紧记忆越有用。中间是预注册探针：只把上下文预算从 16K 放大到 128K，其余设置冻结，并把 token 按用途拆开。右侧为我方在 Gorilla File System、每格 50 题、网关标注端点上的复测：BM25 增益 +4.0 蒸发到 0.0，ACE 增益 +18.0 收窄到 +6.0；ACE 记忆模块占其自身输入 token 的 36.5%，输出约为无记忆基线的 7.4 倍，增益缩水而租金不缩。底部结论为复合判读 PARTIAL，范围限于单环境、单一标注端点、单次运行，Finding 5 未测。</desc>
<defs>
<pattern id="evg-d-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#E7E4DB"/></pattern>
<marker id="evg-d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8A98A6" stroke-width="1"/></marker>
<linearGradient id="evg-d-beamg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C95C" stop-opacity="0"/><stop offset=".5" stop-color="#F5C95C" stop-opacity=".5"/><stop offset="1" stop-color="#F5C95C" stop-opacity="0"/></linearGradient>
</defs>
<style>*{animation:none!important}</style>
<rect width="1200" height="700" fill="#FAF9F5"/><rect width="1200" height="700" fill="url(#evg-d-dots)" opacity=".72"/><rect x="18" y="18" width="1164" height="664" rx="11" fill="none" stroke="#E1DFD7"/>
<text x="40" y="43" font-size="10.5" font-weight="700" letter-spacing="1" fill="#53677B">EVOMEMBENCH / GAIN &amp; COST REVIEW</text>
<rect x="938" y="25" width="220" height="27" rx="5" fill="#F1E9D5" stroke="#E2D4B5"/><text x="1048" y="43" font-size="11.5" font-weight="600" fill="#7A6220" text-anchor="middle">子集复测 · 非论文原口径</text>
<text x="40" y="84" font-size="27" font-weight="700" fill="#16324F">记忆增益，是方法的属性，还是预算的函数？</text>
<text x="40" y="110" font-size="14" fill="#53677B">分数表里有两个没写明的假设：增益随方法走、记忆不再花钱。用一次预注册探针，逐个检查。</text>

<!-- LEFT: surface -->
<g class="surface">
<rect x="40" y="132" width="356" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="40" y="132" width="356" height="34" rx="9" fill="#EFF3F6"/><rect x="40" y="152" width="356" height="14" fill="#EFF3F6"/>
<text x="56" y="154" font-size="13" font-weight="700" fill="#16324F">表面断言</text>
<rect x="252" y="141" width="128" height="17" rx="4" fill="#E8EEF2"/><text x="316" y="153" font-size="10.5" fill="#53677B" text-anchor="middle">论文口径 · 作者自报</text>
<text x="56" y="196" font-size="11.5" font-weight="700" letter-spacing="1" fill="#53677B">FINDING 3 · 论文报告</text>
<text x="56" y="238" font-size="34" font-weight="700" fill="#16324F">+14.5 分</text>
<text x="206" y="238" font-size="13.5" fill="#33475B">16K 档最佳记忆增益</text>
<text x="56" y="262" font-size="12.5" fill="#53677B">骨干 DeepSeek-V3.2 · 15 种方法统一排名</text>
<line x1="56" y1="282" x2="380" y2="282" stroke="#E1DFD7"/>
<text x="56" y="312" font-size="14" fill="#33475B">“预算越紧，记忆越有用”</text>
<text x="56" y="342" font-size="14" fill="#33475B">“程序型记忆最适配执行任务”</text>
<text x="56" y="372" font-size="12.5" fill="#53677B">128K 档：已有方法跌破无记忆基线</text>
<line x1="56" y1="392" x2="380" y2="392" stroke="#E1DFD7"/>
<text x="56" y="420" font-size="12" fill="#8A98A6">以上为论文报告值；本图右侧才是我方测量。</text>
<text x="56" y="446" font-size="12" fill="#8A98A6">隐藏假设 ① 增益是方法的属性，换个预算也成立</text>
<text x="56" y="472" font-size="12" fill="#8A98A6">隐藏假设 ② 分数表之外，记忆不再花钱</text>
<text x="56" y="504" font-size="11.5" font-weight="700" letter-spacing="1" fill="#B08A2E">→ 两个假设都未经检查</text>
</g>

<!-- CENTER: probe -->
<g class="probe">
<rect x="420" y="132" width="360" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="420" y="132" width="360" height="34" rx="9" fill="#FBF3DF"/><rect x="420" y="152" width="360" height="14" fill="#FBF3DF"/>
<text x="436" y="154" font-size="13" font-weight="700" fill="#16324F">反例探针</text>
<rect x="612" y="141" width="152" height="17" rx="4" fill="#F1E9D5"/><text x="688" y="153" font-size="10.5" fill="#7A6220" text-anchor="middle">预注册 · 设置冻结</text>
<text x="436" y="196" font-size="12.5" fill="#33475B">只动一个变量：上下文预算</text>
<rect x="436" y="210" width="86" height="40" rx="6" fill="#EFF3F6" stroke="#C9D4DE"/><text x="479" y="236" font-size="16" font-weight="700" fill="#16324F" text-anchor="middle">16K</text>
<line x1="530" y1="230" x2="596" y2="230" stroke="#8A98A6" marker-end="url(#evg-d-arrow)"/>
<text x="563" y="220" font-size="11" fill="#53677B" text-anchor="middle">放大</text>
<rect x="604" y="210" width="86" height="40" rx="6" fill="#16324F"/><text x="647" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">128K</text>
<text x="436" y="276" font-size="12.5" fill="#53677B">三臂同题对照：无记忆 / BM25 检索 / ACE 程序型</text>
<line x1="436" y1="296" x2="764" y2="296" stroke="#E1DFD7"/>
<text x="436" y="324" font-size="12.5" fill="#33475B">再把每个 episode 的 token 按用途拆开：</text>
<rect x="436" y="338" width="328" height="86" rx="6" fill="#FAF9F5" stroke="#E1DFD7"/>
<text x="448" y="360" font-size="11.5" fill="#53677B">任务执行</text>
<rect x="448" y="368" width="240" height="10" rx="3" fill="#B9C9D6"/>
<text x="448" y="398" font-size="11.5" fill="#7A6220" font-weight="700">记忆维护（反思 · 策展）</text>
<rect x="448" y="406" width="118" height="10" rx="3" fill="#E3B23C"/>
<rect class="focus" x="442" y="384" width="180" height="38" rx="6" fill="none" stroke="#B08A2E" stroke-width="1.4" stroke-opacity=".85"/>
<circle cx="648" cy="392" r="17" fill="none" stroke="#16324F" stroke-width="2"/><line x1="660" y1="404" x2="676" y2="420" stroke="#16324F" stroke-width="2.4"/>
<rect class="scan" x="440" y="334" width="52" height="94" fill="url(#evg-d-beamg)"/>
<text x="436" y="452" font-size="12" fill="#8A98A6">检查动作：预算阶梯 × 成本拆账，两件都预先登记。</text>
<text x="436" y="478" font-size="12" fill="#8A98A6">协议、提示、评分用官方固定提交代码；仅替换传输层。</text>
<text x="436" y="504" font-size="11.5" font-weight="700" letter-spacing="1" fill="#B08A2E">→ 假设 ① 查增益，假设 ② 查账单</text>
</g>

<!-- RIGHT: counterexample results -->
<g class="bars">
<rect x="804" y="132" width="356" height="392" rx="9" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="804" y="132" width="356" height="34" rx="9" fill="#EFF3F6"/><rect x="804" y="152" width="356" height="14" fill="#EFF3F6"/>
<text x="820" y="154" font-size="13" font-weight="700" fill="#16324F">探针结果</text>
<rect x="976" y="141" width="168" height="17" rx="4" fill="#E8EEF2"/><text x="1060" y="153" font-size="10.5" fill="#53677B" text-anchor="middle">我方复测 · Gorilla FS · 每格 n=50</text>
<text x="820" y="192" font-size="12.5" font-weight="700" fill="#33475B">ACE 程序型</text>
<rect x="820" y="200" width="150" height="12" rx="3" fill="#B9C9D6"/><text x="978" y="211" font-size="12" fill="#53677B">16K +18.0</text>
<rect class="shrinkAce" x="820" y="218" width="50" height="12" rx="3" fill="#16324F"/><text x="978" y="229" font-size="12" font-weight="700" fill="#16324F">128K +6.0</text>
<text x="820" y="262" font-size="12.5" font-weight="700" fill="#33475B">BM25 检索</text>
<rect x="820" y="270" width="33" height="12" rx="3" fill="#B9C9D6"/><text x="978" y="281" font-size="12" fill="#53677B">16K +4.0</text>
<rect class="shrinkBm" x="820" y="288" width="3" height="12" rx="1.5" fill="#C4463F"/><text x="978" y="299" font-size="12" font-weight="700" fill="#C4463F">128K 0.0 · 蒸发</text>
<text x="820" y="326" font-size="12" fill="#53677B">基线本身也在变强：无记忆 38% → 44%（19/50 → 22/50）</text>
</g>
<g class="rent">
<rect x="820" y="344" width="324" height="112" rx="7" fill="#FBF0EE" stroke="#C4463F" stroke-dasharray="5 4"/>
<text x="836" y="368" font-size="12" font-weight="700" letter-spacing="1" fill="#C4463F">分数表没显示的租金</text>
<text x="836" y="396" font-size="15.5" fill="#33475B">ACE 记忆模块 = 自身输入的 <tspan font-weight="700" fill="#C4463F">36.5%</tspan></text>
<text x="836" y="420" font-size="12.5" fill="#33475B">输出 ≈ 基线 7.4×</text>
<text x="836" y="442" font-size="12.5" fill="#33475B">增益缩水，租金不缩（134 万 → 132 万）</text>
</g>
<g class="paired">
<text x="820" y="478" font-size="11.5" fill="#33475B">配对复核（同 50 题）：ACE@16K 多对 9 · 少对 0</text>
<text x="820" y="498" font-size="11.5" fill="#53677B">收窄 12 点 · 配对 bootstrap CI [0, +26]</text>
<text x="820" y="518" font-size="11.5" fill="#8A98A6">BM25 收窄与零无法区分 · 跌破基线本子集未出现</text>
</g>

<!-- BOTTOM: method chain + scope -->
<g class="scope">
<line x1="40" y1="544" x2="1160" y2="544" stroke="#E1DFD7"/>
<text x="40" y="572" font-size="12" font-weight="700" letter-spacing="1" fill="#53677B">方法链</text>
<text x="40" y="600" font-size="14.5" fill="#33475B">预注册 <tspan fill="#8A98A6">→</tspan> 只变预算 <tspan fill="#8A98A6">→</tspan> 按用途拆 token <tspan fill="#8A98A6">→</tspan> 复合判读 <tspan font-weight="700" fill="#B08A2E">PARTIAL</tspan></text>
<text x="40" y="628" font-size="12.5" fill="#53677B">方向复现：增益随预算收窄 · 尾部子句（跌破基线）未复现</text>
<line x1="700" y1="560" x2="700" y2="648" stroke="#E1DFD7"/>
<text x="724" y="572" font-size="12" font-weight="700" letter-spacing="1" fill="#53677B">证据范围</text>
<text x="724" y="600" font-size="12.5" fill="#33475B">单环境 Gorilla FS · 单一网关标注端点（身份不可核验）</text>
<text x="724" y="628" font-size="12.5" fill="#33475B">单次运行 · Finding 5 未测（探针已取消）</text>
</g>
</svg>
